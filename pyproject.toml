[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeml"
version = "0.1.0"
readme = "README.md"
description = "ForgeML: a minimal deep-learning compiler with an IR, optimization passes, and memory planning"
license = "MIT"
authors = [
    {name = "Rayhan Khilji"},
]
keywords = [
    "machine-learning",
    "deep-learning",
    "compiler",
    "inference",
    "distributed",
    "triton",
    "tensor-parallelism",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
]

[project.scripts]
forgeml = 'forgeml.benchmarks:main'

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "build==1.6.1",
    "twine==6.0.1",
]
onnx = [
    "onnx==1.22.0",
]
gpu = [
    "triton==3.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/rayhankhilji/ForgeML"
Repository = "https://github.com/rayhankhilji/ForgeML"
Issues = "https://github.com/rayhankhilji/ForgeML/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgeml = ["py.typed"]
nebula = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a CUDA GPU with triton installed",
    "distributed: tests that spawn torch.distributed gloo process groups",
]
