name: correctness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade 'pip==26.0.1'
      - run: python -m pip install -e '.[dev,onnx]'
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: pytest -q
      - run: python examples/compile_mlp.py
      - run: python -m build
